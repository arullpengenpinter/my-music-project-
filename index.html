<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121218">
  <meta name="description" content="Pemutar musik sederhana untuk file audio pilihanmu.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <title>My Music</title>
  <style>
    :root{color-scheme:dark;--bg:#101016;--panel:#1b1b25;--panel2:#242432;--text:#f6f4ff;--muted:#a8a6b7;--accent:#b8a0ff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Arial,sans-serif}
    .app{width:min(100%,520px);margin:auto;padding:22px 18px 40px}
    header{display:flex;align-items:center;gap:10px;margin:5px 0 24px}
    .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:#171321;font-size:24px;font-weight:800}
    h1{font-size:23px;margin:0;letter-spacing:-.5px} header p{margin:3px 0 0;color:var(--muted);font-size:13px}
    .cover{height:245px;border-radius:26px;background:radial-gradient(circle at 70% 20%,#6854a8 0,#32294e 35%,#20202e 75%);display:grid;place-items:center;font-size:86px;margin-bottom:22px;box-shadow:0 18px 45px #0005}
    .now{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .song-title{font-size:19px;font-weight:750;overflow-wrap:anywhere;margin:0}
    .sub{color:var(--muted);font-size:13px;margin:5px 0 0}
    .pick{display:block;width:100%;margin:20px 0 14px;padding:13px;background:var(--panel);border:1px dashed #5b566c;border-radius:14px;color:var(--text)}
    .timeline{margin:20px 0 12px}
    input[type=range]{width:100%;accent-color:var(--accent)}
    .times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:3px}
    .controls{display:flex;justify-content:center;align-items:center;gap:16px;margin:16px 0 22px}
    button{font:inherit;cursor:pointer;border:0}
    .ctl{width:46px;height:46px;border-radius:50%;background:var(--panel2);color:var(--text);font-size:19px}
    .play{width:62px;height:62px;border-radius:50%;background:var(--accent);color:#171321;font-size:24px;font-weight:800}
    .section-title{font-size:16px;margin:25px 0 10px}
    .search{width:100%;padding:12px 14px;background:var(--panel);border:1px solid #323240;border-radius:12px;color:var(--text);outline:none}
    .list{display:grid;gap:8px;margin-top:12px}
    .track{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border-radius:14px}
    .track-num{width:36px;height:36px;display:grid;place-items:center;background:var(--panel2);border-radius:10px;color:var(--accent);flex-shrink:0}
    .track-info{min-width:0;flex:1}.track-name{font-size:14px;font-weight:650;overflow-wrap:anywhere}.track-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .track button{background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 11px}
    .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 8px}
    .volume{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
    footer{text-align:center;color:#777487;font-size:11px;margin-top:28px}
    audio{display:none}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="logo">♫</div>
    <div><h1>My Music</h1><p>Musikmu, cara sederhana.</p></div>
  </header>

  <div class="cover" aria-label="Ilustrasi musik">♫</div>

  <div class="now">
    <div><h2 class="song-title" id="currentTitle">Belum ada lagu dipilih</h2><p class="sub" id="currentSub">Pilih file audio dari perangkatmu</p></div>
  </div>

  <input class="pick" id="filePicker" type="file" accept="audio/*" multiple aria-label="Pilih file musik">
  <audio id="audio" preload="metadata"></audio>

  <div class="timeline">
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu">
    <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
  </div>

  <div class="controls">
    <button class="ctl" id="prev" aria-label="Lagu sebelumnya">⏮</button>
    <button class="play" id="play" aria-label="Putar">▶</button>
    <button class="ctl" id="next" aria-label="Lagu berikutnya">⏭</button>
  </div>
  <div class="volume"><span>Volume</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>

  <h3 class="section-title">Daftar lagu</h3>
  <input id="search" class="search" type="search" placeholder="Cari lagu yang dipilih..." aria-label="Cari lagu">
  <div id="playlist" class="list"><div class="empty">Lagu yang kamu pilih akan muncul di sini.</div></div>
  <footer>My Music · Versi 1.0 · Memutar file yang kamu pilih di perangkat.</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  let tracks = [], current = -1, activeUrl = null;
  const format = seconds => {
    if (!Number.isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  };
  function renderList() {
    const query = $('search').value.trim().toLowerCase();
    const list = $('playlist'); list.replaceChildren();
    const shown = tracks.map((t,i)=>({...t,index:i})).filter(t=>t.name.toLowerCase().includes(query));
    if (!shown.length) {
      const empty = document.createElement('div'); empty.className='empty';
      empty.textContent = tracks.length ? 'Tidak ada lagu yang cocok.' : 'Lagu yang kamu pilih akan muncul di sini.';
      list.append(empty); return;
    }
    shown.forEach(t => {
      const row=document.createElement('div'); row.className='track';
      const num=document.createElement('div'); num.className='track-num'; num.textContent=String(t.index+1).padStart(2,'0');
      const info=document.createElement('div'); info.className='track-info';
      const name=document.createElement('div'); name.className='track-name'; name.textContent=t.name;
      const meta=document.createElement('div'); meta.className='track-meta'; meta.textContent=t.index===current?'Sedang dipilih':'File audio';
      info.append(name,meta);
      const btn=document.createElement('button'); btn.textContent=t.index===current&&!audio.paused?'Jeda':'Putar';
      btn.addEventListener('click',()=>{ if(t.index===current&&!audio.paused) audio.pause(); else load(t.index,true); });
      row.append(num,info,btn); list.append(row);
    });
  }
  function load(index, autoplay=false) {
    if (!tracks.length) return;
    current=(index+tracks.length)%tracks.length;
    if(activeUrl) URL.revokeObjectURL(activeUrl);
    activeUrl=URL.createObjectURL(tracks[current].file);
    audio.src=activeUrl;
    $('currentTitle').textContent=tracks[current].name;
    $('currentSub').textContent=`Lagu ${current+1} dari ${tracks.length}`;
    $('play').textContent='▶'; $('play').setAttribute('aria-label','Putar');
    $('seek').value=0; $('elapsed').textContent='0:00'; $('duration').textContent='0:00';
    renderList();
    if(autoplay) audio.play().catch(()=>{});
  }
  $('filePicker').addEventListener('change',e=>{
    if(activeUrl){URL.revokeObjectURL(activeUrl);activeUrl=null}
    audio.pause(); tracks=Array.from(e.target.files||[]).filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|m4a|aac|ogg|opus|flac)$/i.test(f.name)).map(file=>({file,name:file.name}));
    current=-1;
    if(tracks.length) load(0,false);
    else { $('currentTitle').textContent='Belum ada lagu dipilih'; $('currentSub').textContent='Pilih file audio dari perangkatmu'; renderList(); }
  });
  $('play').addEventListener('click',()=>{
    if(current<0){$('filePicker').click();return}
    if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
  });
  $('prev').addEventListener('click',()=>{if(tracks.length)load(current<=0?tracks.length-1:current-1,true)});
  $('next').addEventListener('click',()=>{if(tracks.length)load(current+1,true)});
  audio.addEventListener('play',()=>{$('play').textContent='Ⅱ';$('play').setAttribute('aria-label','Jeda');renderList()});
  audio.addEventListener('pause',()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','Putar');renderList()});
  audio.addEventListener('loadedmetadata',()=>{$('duration').textContent=format(audio.duration)});
  audio.addEventListener('timeupdate',()=>{
    $('elapsed').textContent=format(audio.currentTime);
    if(Number.isFinite(audio.duration)&&audio.duration>0)$('seek').value=audio.currentTime/audio.duration*1000;
  });
  $('seek').addEventListener('input',()=>{
    if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number($('seek').value)/1000*audio.duration;
  });
  $('volume').addEventListener('input',()=>audio.volume=Number($('volume').value));
  audio.volume=.8;
  audio.addEventListener('ended',()=>{if(current<tracks.length-1)load(current+1,true);else{$('play').textContent='▶';renderList()}});
  $('search').addEventListener('input',renderList);
  window.addEventListener('pagehide',()=>{if(activeUrl)URL.revokeObjectURL(activeUrl)});
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
